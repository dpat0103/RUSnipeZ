name: daily history

on:
  schedule:
    - cron: "43 13 * * *"
  workflow_dispatch:
    inputs:
      term:
        description: "WebReg term code"
        default: "02027"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-history
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HISTORY_TERM: ${{ inputs.term || '02027' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install -e .
      - name: Restore persistent history branch
        shell: bash
        run: |
          set -euo pipefail
          history_dir="$RUNNER_TEMP/daily-history"
          if git ls-remote --exit-code --heads origin refs/heads/history-data > "$RUNNER_TEMP/history-ref"; then
            git fetch --depth=1 origin history-data
            git worktree add --detach "$history_dir" FETCH_HEAD
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
            git worktree add --detach "$history_dir" HEAD
            git -C "$history_dir" switch --orphan history-data
          fi
      - name: Take one daily observation
        run: |
          .venv/bin/python -m rusnipez.history.daily \
            --term "$HISTORY_TERM" \
            --out "$RUNNER_TEMP/daily-history/history-$HISTORY_TERM.json" \
            --seed "web/data/history-$HISTORY_TERM.json"
      - name: Publish history without rebuilding the application
        shell: bash
        run: |
          set -euo pipefail
          history_dir="$RUNNER_TEMP/daily-history"
          printf '%s\n' '{"ignoreCommand":"exit 0"}' > "$history_dir/vercel.json"
          printf '%s\n' 'Daily Rutgers open-section observations. Generated by the daily history workflow.' > "$history_dir/README.md"
          git -C "$history_dir" config user.name "github-actions[bot]"
          git -C "$history_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$history_dir" add -- "history-$HISTORY_TERM.json" README.md vercel.json
          if ! git -C "$history_dir" diff --cached --quiet; then
            git -C "$history_dir" commit -m "Record daily open-section observation"
            git -C "$history_dir" push origin HEAD:refs/heads/history-data
          fi
