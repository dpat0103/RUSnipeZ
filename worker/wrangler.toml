name = "ru-snipez-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Comma-separated origins allowed to call this proxy, or "*" while developing.
# Tighten this to your deployed frontend before going public.
[vars]
ALLOWED_ORIGINS = "*"
# Retired continuous collector. Existing alarms stop on their next invocation.
HISTORY_TERMS = ""
# Keep existing snapshots readable during the website migration.
SNAPSHOT_TERMS = "92026"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "ru-snipez-snapshots"

[[durable_objects.bindings]]
name = "SEAT_HISTORY"
class_name = "SeatHistory"

[[migrations]]
tag = "v1-seat-history"
new_sqlite_classes = ["SeatHistory"]

[triggers]
crons = []
