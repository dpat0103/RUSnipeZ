# Used for authoring migrations: `alembic revision --autogenerate -m "..."`.
# Applying them is `rusnipez migrate`, which reads RUSNIPEZ_DATABASE_URL.
[alembic]
script_location = %(here)s/src/rusnipez/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
