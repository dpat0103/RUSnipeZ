# Production overrides for a small (1 GB) server. Use with:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# Secrets come from a .env file next to this one (POSTGRES_PASSWORD, ...).

x-logging: &logging
  driver: json-file
  # The poller logs continuously; cap each container at 30 MB of logs.
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Defaults assume a much larger machine.
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
    mem_limit: 256m
    logging: *logging

  service:
    mem_limit: 512m
    logging: *logging

  # HTTPS for the API. The only container reachable from the internet.
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - service
    environment:
      RUSNIPEZ_HOST: ${RUSNIPEZ_HOST:?set RUSNIPEZ_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging: *logging

volumes:
  # Certificates live here; keeping them avoids re-issuing on every restart.
  caddy_data:
  caddy_config:
